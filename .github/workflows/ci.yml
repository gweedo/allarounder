name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run only. publish.yml opens its content PRs with PUBLISH_TOKEN,
  # so they get the normal `pull_request` run; a dispatched run's checks
  # would not attach to the PR anyway.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"

jobs:
  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: src/frontend
        run: npm run lint

      - name: Type-check (tsc)
        working-directory: src/frontend
        run: npm run typecheck

      - name: Build (static export)
        working-directory: src/frontend
        run: npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pipeline dependencies
        working-directory: src/pipeline
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: src/pipeline
        run: ruff check .

      - name: Type-check (mypy)
        working-directory: src/pipeline
        run: mypy domain ingest

  test-vitest:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run tests
        working-directory: src/frontend
        run: npm test -- --coverage --coverage.thresholds.lines=80

  # Runs the Playwright specs (visitor flows + axe accessibility) against the
  # static export served like Cloudflare Pages, not `next dev` -- see
  # playwright.config.ts. Chromium only, to keep the run short.
  test-e2e:
    name: Test (E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Build (static export)
        working-directory: src/frontend
        run: npm run build

      - name: Install Chromium
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: src/frontend
        env:
          E2E_STATIC: "1"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: src/frontend/playwright-report/
          retention-days: 7

  test-pytest:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: src/pipeline
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        working-directory: src/pipeline
        run: python -m pytest -q --cov --cov-fail-under=80

  # Not a security control (a PR can edit this file): it only stops a new,
  # unfixable advisory from freezing unattended publish.yml content PRs,
  # whose audit result is identical to main's. Any doubt => audit runs.
  audit-scope:
    name: Audit scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.classify.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # HEAD^1 of the PR merge commit is the base tip

      - name: Classify changed paths
        id: classify
        run: |
          if files=$(git -c core.quotePath=false diff --name-only --no-renames HEAD^1 HEAD) &&
            printf '%s\n' "$files" | sh .github/scripts/content-only.sh; then
            echo "::notice::Content-only PR: Security scan skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not content-only: Security scan runs."
          fi

  # A job skipped by `if:` reports success to required status checks.
  security-scan:
    name: Security scan
    needs: audit-scope
    if: ${{ !cancelled() && needs.audit-scope.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      # Blocks only on what ships in the static export. Dev tooling (lint,
      # test) never reaches the site, and an unfixable dev-only advisory
      # (e.g. `braces` via eslint-config-next, no patched release) would
      # otherwise freeze every PR -- including unattended content PRs from
      # publish.yml. The full audit still runs below, reported, non-blocking.
      - name: Dependency audit (npm audit, runtime)
        working-directory: src/frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit (npm audit, dev -- report only)
        working-directory: src/frontend
        continue-on-error: true
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pipeline dependencies
        working-directory: src/pipeline
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]" pip-audit

      - name: Dependency audit (pip-audit)
        working-directory: src/pipeline
        run: pip-audit --skip-editable --vulnerability-service pypi

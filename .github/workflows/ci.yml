name: CI

on:
  push:
    branches: [main]
  pull_request:
  # publish.yml dispatches this explicitly on its content PR branch: a PR
  # opened with GITHUB_TOKEN never triggers `pull_request` runs, so the
  # required checks would otherwise never report and auto-merge never fire.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"

jobs:
  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: src/frontend
        run: npm run lint

      - name: Type-check (tsc)
        working-directory: src/frontend
        run: npm run typecheck

      - name: Build (static export)
        working-directory: src/frontend
        run: npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pipeline dependencies
        working-directory: src/pipeline
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: src/pipeline
        run: ruff check .

      - name: Type-check (mypy)
        working-directory: src/pipeline
        run: mypy domain ingest

  test-vitest:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run tests
        working-directory: src/frontend
        run: npm test -- --coverage --coverage.thresholds.lines=80

  test-pytest:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: src/pipeline
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        working-directory: src/pipeline
        run: python -m pytest -q --cov --cov-fail-under=80

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci

      # Blocks only on what ships in the static export. Dev tooling (lint,
      # test) never reaches the site, and an unfixable dev-only advisory
      # (e.g. `braces` via eslint-config-next, no patched release) would
      # otherwise freeze every PR -- including unattended content PRs from
      # publish.yml. The full audit still runs below, reported, non-blocking.
      - name: Dependency audit (npm audit, runtime)
        working-directory: src/frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency audit (npm audit, dev -- report only)
        working-directory: src/frontend
        continue-on-error: true
        run: npm audit --audit-level=high

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pipeline dependencies
        working-directory: src/pipeline
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]" pip-audit

      - name: Dependency audit (pip-audit)
        working-directory: src/pipeline
        run: pip-audit --skip-editable --vulnerability-service pypi

name: Publish content

on:
  repository_dispatch:
    types: [publish_request]
  schedule:
    # Nightly, catches Pubblicato rows whose `data` has since passed
    # (CONTENT-CONTRACT.md §3) -- future-dated posts set up in advance.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: publish-content
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    name: Run pipeline
    runs-on: ubuntu-latest
    env:
      # Absolute, so it resolves the same regardless of which step's
      # working-directory wrote or reads it (see docs/DECISIONS.md
      # "Deferred esito writes and publish-run guards").
      DEFERRED_ESITO_PATH: ${{ github.workspace }}/src/pipeline/deferred-esito.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pipeline
        working-directory: src/pipeline
        run: pip install -e .

      # `gh pr merge --auto --squash` below silently no-ops (or fails) if
      # either repo setting is off -- fail loudly now, before doing any
      # work, rather than discovering it after a real Drive export.
      - name: Verify repo settings auto-merge depends on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          settings=$(gh api "repos/${{ github.repository }}" --jq '{allow_auto_merge, allow_squash_merge}')
          auto_merge=$(echo "$settings" | jq -r '.allow_auto_merge')
          squash=$(echo "$settings" | jq -r '.allow_squash_merge')
          if [ "$auto_merge" != "true" ] || [ "$squash" != "true" ]; then
            echo "::error::gh pr merge --auto --squash needs both 'Allow auto-merge' and 'Allow squash merging' enabled (Settings -> General -> Pull Requests). Current: allow_auto_merge=$auto_merge allow_squash_merge=$squash" >&2
            exit 1
          fi

      # A stalled content PR (failed check, conflict, auto-merge disabled
      # mid-flight) is invisible to `index.json`'s skip check, so a naive
      # run would open a competing branch every night. Fail fast instead --
      # see ingest/pr_guard.py.
      - name: Guard against a stalled publish PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m ingest.pr_guard

      - name: Run pipeline
        working-directory: src/pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python -m ingest.cli

      - name: Check for generated content changes
        id: diff
        run: |
          git add src/frontend/content
          if [ -d src/frontend/public/images ]; then
            git add src/frontend/public/images
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Never pushes to main directly (branch protection, "Protect main"
      # ruleset) -- opens a PR instead, which still runs the required checks
      # in ci.yml (including `next build` against the new content) before
      # it merges. The ruleset requires 0 human approvals (status checks
      # only), so auto-merge lets this PR merge itself once those checks
      # pass -- no admin bypass, no direct push, but still close to the
      # original "article is live ~2 minutes after Pubblica" design intent.
      #
      # Waits for the PR to actually report MERGED (ingest/pr_wait.py)
      # before the step -- and therefore the job -- exits: `concurrency:
      # group: publish-content` only serialises the job, so a job that
      # exited right after *enabling* auto-merge could release that slot
      # before the merge landed, letting the next run branch from a `main`
      # that doesn't have this run's content yet.
      - name: Open content PR and wait for it to merge
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="content/publish-${{ github.run_id }}"
          git config user.name "allarounder-pipeline"
          git config user.email "actions@github.com"
          git checkout -b "$branch"
          git commit -m "content: publish from the editorial Sheet ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push origin "$branch"
          pr_url=$(gh pr create \
            --base main \
            --head "$branch" \
            --title "content: publish from the editorial Sheet" \
            --body "Automated publish run. See the Actions log for this run for which rows were published, scheduled, or rejected, and why.")
          pr_number="${pr_url##*/}"
          gh pr merge "$pr_number" --auto --squash
          python -m ingest.pr_wait "$pr_number"

      # Runs whenever the job hasn't already failed: unconditionally when
      # there was no content diff (nothing to wait on), and after the step
      # above only once it confirmed the PR actually merged -- if that step
      # failed (timeout, or the PR was closed unmerged), this is skipped by
      # GitHub Actions' default `if: success()`, so a success esito is never
      # written for content that didn't ship. See ingest/deferred_esito.py.
      - name: Flush deferred esito writes
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python -m ingest.flush_esito

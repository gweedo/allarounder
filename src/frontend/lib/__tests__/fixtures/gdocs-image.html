<!--
  Hand-built approximation of clipboard HTML that Google Docs puts on
  text/html when copying an inline image followed by a caption paragraph.
  Google Docs serves pasted images from a lh7-us.googleusercontent.com CDN
  URL that expires, not from a stable link — this is the case
  html-to-markdown.ts's externalImages collection exists to handle (the
  editor re-uploads the bytes to our own Blob Storage). Authored by hand from
  the documented shape (image wrapped in a sizing <span>, empty title attr).
  Re-capture from a real Google Doc if paste conversion bugs surface around
  images.
-->
